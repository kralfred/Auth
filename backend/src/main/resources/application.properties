spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&currentSchema=${DB_SCHEMA:public},public
spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 3. Docker Compose Settings
spring.docker.compose.file=compose.yaml
spring.docker.compose.enabled=true
# Use 'active' to ensure Spring stays connected to the container it started
spring.docker.compose.lifecycle-management=start_only

app.cors.allowed-origins=${FRONTEND_URL}

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.datasource.hikari.schema=${DB_SCHEMA:public}

spring.liquibase.default-schema=${DB_SCHEMA:public}
spring.liquibase.rollback-on-error=true


spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=1

server.port=${PORT:8080}
app.security.password.min-length=12
app.security.password.require-special-chars=true

management.endpoints.web.exposure.include=refresh

spring.cloud.bootstrap.enabled=true

# Tell Spring to pass the env file to the docker command it runs
spring.docker.compose.skip.in-tests=false

# Debugging

#logging.level.org.springframework.jdbc.core.simple.JdbcClient=DEBUG
logging.level.liquibase=DEBUG
logging.level.org.liquibase=DEBUG
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG
logging.level.org.springframework.jdbc=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.jdbc.core.JdbcTemplate=TRACE
#logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
#logging.level.org.postgresql=INFO

spring.sql.init.mode=never



